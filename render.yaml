services:
  - type: web
    name: wellmarket-100-rejeicoes-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://leorbr27.github.io
      - key: DATABASE_URL
        sync: false
