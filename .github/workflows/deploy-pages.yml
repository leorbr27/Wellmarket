name: Publicar Well Market no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Compilar para hospedagem estática
        run: bunx vite build --config vite.config.pages.ts

      - name: Preparar arquivos do GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/client
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
          fi
          test -f dist/client/index.html
          mkdir -p dist/client/docs
          cp docs/well-market-apresentacao.pdf dist/client/docs/well-market-apresentacao.pdf
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
