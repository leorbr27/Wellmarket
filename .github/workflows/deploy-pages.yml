name: Publicar Well Market no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar arquivos estáticos (sem build)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/site/docs dist/site/src/assets dist/site/public
          cp index.html styles.css script.js referencias.html rejeicoes.html dist/site/
          cp docs/well-market-apresentacao.pdf dist/site/docs/well-market-apresentacao.pdf
          cp src/assets/well-market-store.jpg dist/site/src/assets/well-market-store.jpg
          cp public/favicon.svg dist/site/public/favicon.svg
          cp public/robots.txt dist/site/robots.txt
          touch dist/site/.nojekyll
          test -s dist/site/index.html
          test -s dist/site/styles.css
          test -s dist/site/script.js
          test -s dist/site/referencias.html
          test -s dist/site/rejeicoes.html
          test -s dist/site/docs/well-market-apresentacao.pdf

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4